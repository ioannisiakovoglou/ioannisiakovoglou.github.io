{% include base_path %}

<div class="{{ include.type | default: "list" }}__item">
  <article class="archive__item" itemscope itemtype="http://schema.org/CreativeWork">

    <div class="publication-entry">

      <h2 class="archive__item-title" itemprop="headline">
        <span class="publication-arrow" aria-hidden="true">▸</span>
        {{ post.title }}
      </h2>

      {% if post.type %}
        <p class="teaching-detail">{{ post.type }}</p>
      {% endif %}

      {% if post.institution %}
        <p class="teaching-detail">{{ post.institution }}</p>
      {% endif %}

      {% for period in post.periods %}
        <p class="teaching-detail">{{ period }}</p>
      {% endfor %}

      {% if post.description %}
        <p class="teaching-detail">{{ post.description }}</p>
      {% endif %}

    </div>

  </article>
</div>
